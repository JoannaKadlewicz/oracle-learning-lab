name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Tests and content checks (Oracle XE 21c)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      oracle:
        image: gvenzl/oracle-xe:21-slim-faststart
        env:
          ORACLE_PASSWORD: ci_sys_password
          APP_USER: orastudy
          APP_USER_PASSWORD: orastudy
        ports:
          - 1521:1521
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 10s
          --health-timeout 10s
          --health-retries 60
          --health-start-period 30s

    env:
      STUDY_DSN: localhost:1521/XEPDB1
      STUDY_USER: orastudy
      STUDY_PASSWORD: orastudy
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: app/requirements*.txt

      - name: Install dependencies
        run: pip install -r app/requirements-dev.txt

      - name: Content structure checks (no database)
        run: python app/validate_content.py --static

      - name: Create the sample schema
        run: python app/init_db.py

      - name: Tests (pytest)
        run: python -m pytest -q app/tests

      # The content was written and verified on Oracle 19c; this job runs it on XE 21c.
      # A failure here can be a real content error or a 19c/21c behaviour difference:
      # read the messages before changing content.
      - name: Content checks against the database (Oracle XE 21c)
        if: ${{ !cancelled() }}
        run: python app/validate_content.py
