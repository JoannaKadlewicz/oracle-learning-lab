name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Tests and content checks (Oracle XE 21c)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      oracle:
        image: gvenzl/oracle-xe:21-slim-faststart
        env:
          ORACLE_PASSWORD: ci_sys_password
          APP_USER: orastudy
          APP_USER_PASSWORD: orastudy
        ports:
          - 1521:1521
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 10s
          --health-timeout 10s
          --health-retries 60
          --health-start-period 30s

    env:
      STUDY_DSN: localhost:1521/XEPDB1
      STUDY_USER: orastudy
      STUDY_PASSWORD: orastudy
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the app and the dev tools
        run: pip install -e '.[dev]'

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Content structure checks (no database)
        run: oracle-lab validate --static

      - name: Create the sample schema
        run: oracle-lab init-db

      - name: Tests (pytest)
        run: python -m pytest -q

      # The content was written and verified on Oracle 19c; this job runs it on XE 21c.
      # A failure here can be a real content error or a 19c/21c behaviour difference:
      # read the messages before changing content.
      - name: Content checks against the database (Oracle XE 21c)
        if: ${{ !cancelled() }}
        run: oracle-lab validate

  test-23ai:
    name: 1Z0-171 content checks (Oracle 23ai Free)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      oracle23:
        image: gvenzl/oracle-free:23-slim-faststart
        env:
          ORACLE_PASSWORD: ci_sys_password
          APP_USER: orastudy
          APP_USER_PASSWORD: orastudy
        ports:
          - 1521:1521
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 10s
          --health-timeout 10s
          --health-retries 60
          --health-start-period 30s

    env:
      STUDY_DSN: localhost:1521/FREEPDB1
      STUDY_USER: orastudy
      STUDY_PASSWORD: orastudy
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the app
        run: pip install .

      # The validator opens many short sessions; the default process limit of Oracle Free is too low.
      - name: Grant privileges and raise the process limit
        run: |
          docker exec -i ${{ job.services.oracle23.id }} sqlplus -s / as sysdba < docker/23ai/01-grants.sql
          echo "ALTER SYSTEM SET processes=600 SCOPE=SPFILE;" | docker exec -i ${{ job.services.oracle23.id }} sqlplus -s / as sysdba
          docker restart ${{ job.services.oracle23.id }}

      - name: Create the sample schema
        run: oracle-lab init-db

      # Oracle 23ai or later: the validator checks the items of the 1Z0-171 track.
      - name: Content checks against the database (Oracle 23ai)
        run: oracle-lab validate

  container:
    name: Container scripts and the app-only image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The all-in-one image needs a licensed Oracle 19c base image, which CI does not have;
    # its scripts are checked here, and the app-only image is built and smoke-tested.
    steps:
      - uses: actions/checkout@v4

      - name: Shellcheck
        run: shellcheck docker/oracle/*.sh docker/oracle/startup/*.sh scripts/*.sh

      - name: Compose file is valid
        run: scripts/init-secrets.sh && docker compose config --quiet

      - name: Build the app-only image
        run: docker build -f docker/app.Dockerfile -t oracle-learning-lab-app .

      - name: Smoke test (health check without a database)
        run: |
          docker run -d --name app -p 127.0.0.1:8071:8071 oracle-learning-lab-app oracle-lab serve
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8071/healthz && exit 0; sleep 1; done
          docker logs app; exit 1
