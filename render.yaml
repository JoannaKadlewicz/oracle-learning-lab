# Render Blueprint for Oracle Learning Lab: the app-only image (see docs/docker.md, "Only the app").
# Render does not host Oracle: point STUDY_DSN at a database reachable from the internet.
services:
  - type: web
    name: oracle-learning-lab
    runtime: docker
    dockerfilePath: ./docker/app.Dockerfile
    # A persistent disk needs a paid instance; without it every deploy or restart wipes your progress.
    plan: starter
    healthCheckPath: /healthz
    autoDeploy: true
    disk:
      name: study-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: STUDY_DATA_DIR        # progress.json and saved notes, on the disk
        value: /var/data
      - key: STUDY_HOST
        value: 0.0.0.0
      - key: STUDY_DSN             # e.g. db.example.com:1521/XEPDB1 or an Easy Connect string
        sync: false
      - key: STUDY_USER
        value: orastudy
      - key: STUDY_PASSWORD        # password of the learning user (a Render secret, never in this file)
        sync: false
      - key: STUDY_DSN_23AI        # optional: Oracle 23ai database for the 1Z0-171 track
        sync: false
      - key: STUDY_AUTH_USER       # login for the web app (basic auth)
        value: study
      - key: STUDY_AUTH_PASSWORD   # generated; read it in the Render dashboard
        generateValue: true
      - key: STUDY_INIT_TIMEOUT    # seconds to wait for the database before the deploy fails
        value: "180"
