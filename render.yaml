# Render Blueprint for Oracle Learning Lab: the app-only image (see docs/docker.md, "Only the app").
# Render does not host Oracle: point STUDY_DSN at a database reachable from the internet, e.g. an
# Always Free Oracle Autonomous Database. Progress and saved notes are kept in that database too
# (STUDY_STATE_USER), so the free plan, which has no persistent disk, loses nothing on a restart.
services:
  - type: web
    name: oracle-learning-lab
    runtime: docker
    dockerfilePath: ./docker/app.Dockerfile
    plan: free
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PORT                  # the port Render routes to; the image sets STUDY_HOST=0.0.0.0, STUDY_PORT=8071
        value: "8071"
      - key: STUDY_DSN             # e.g. the TLS connect string of an Autonomous Database (mTLS not required)
        sync: false
      - key: STUDY_USER
        sync: false
      - key: STUDY_PASSWORD        # password of the learning user (a Render secret, never in this file)
        sync: false
      - key: STUDY_STATE_USER      # owns the progress and notes tables; not the learning user (see docs/docker.md)
        sync: false
      - key: STUDY_STATE_PASSWORD
        sync: false
      - key: STUDY_DSN_23AI        # optional: Oracle 23ai database for the 1Z0-171 track
        sync: false
      - key: STUDY_PUBLIC_URL      # the https address of this service; also the Google redirect URI base
        sync: false
      - key: STUDY_TRUST_PROXY     # Render's proxy sets X-Forwarded-For; rate limits then see the real client
        value: "1"
      - key: STUDY_ADMIN_EMAIL     # the account that becomes administrator when it signs up
        sync: false
      - key: STUDY_GOOGLE_CLIENT_ID      # optional: "Sign in with Google" (see docs/docker.md)
        sync: false
      - key: STUDY_GOOGLE_CLIENT_SECRET
        sync: false
      - key: STUDY_PROVISIONER_USER      # creates and drops the private practice schemas; ADMIN on Autonomous
        value: ADMIN
      - key: STUDY_PROVISIONER_PASSWORD
        sync: false
      - key: STUDY_GATEWAY_USER          # proxy user the app connects through (CREATE SESSION only)
        sync: false
      - key: STUDY_GATEWAY_PASSWORD
        sync: false
      - key: STUDY_PRACTICE_TABLESPACE   # default tablespace of a practice schema (DATA on Autonomous)
        value: DATA
      - key: STUDY_INIT_TIMEOUT    # seconds to wait for the database before the deploy fails;
        value: "300"               # an idle Always Free database can take a while to answer
