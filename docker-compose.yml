# Oracle Learning Lab: Oracle Database 19c and the web app in one container.
#
#   make secrets            generate the passwords into ./secrets (once)
#   make up                 build and start; open http://127.0.0.1:8071 (register the first account)
#
# The database files live on the host in ${DATA_DIR}/oradata, the app's progress and notes in
# ${DATA_DIR}/app, so `docker compose down` (even with -v) never deletes them. See docs/docker.md.
#
# Optional, the 1Z0-171 track on Oracle 23ai as well:
#   STUDY_DSN_23AI=oracle23:1521/FREEPDB1 docker compose --profile 23ai up -d

name: oracle-learning-lab

services:
  # Host folders are created by Docker as root; Oracle runs as uid 54321 and must own them.
  prepare-data:
    image: busybox:1.37.0
    user: "0:0"
    command: ["sh", "-c", "mkdir -p /data/oradata /data/oradata-23ai /data/app && chown 54321:54321 /data/oradata /data/oradata-23ai /data/app"]
    volumes:
      - ${DATA_DIR:-./data}:/data
    restart: "no"

  lab:
    build:
      context: .
      args:
        ORACLE_BASE_IMAGE: ${ORACLE_BASE_IMAGE:-oracledb:19.3.0}
    image: oracle-learning-lab:${LAB_IMAGE_TAG:-latest}
    depends_on:
      prepare-data:
        condition: service_completed_successfully
    init: true                 # tini as PID 1: forwards signals, reaps Oracle's orphaned processes
    shm_size: 1g               # Oracle's shared memory
    stop_grace_period: 3m      # time for SHUTDOWN IMMEDIATE before Docker kills the database
    environment:
      # Accounts: users sign up (or sign in with Google) and each gets a private practice schema.
      STUDY_PUBLIC_URL: ${STUDY_PUBLIC_URL:-http://localhost:8071}
      STUDY_ADMIN_EMAIL: ${STUDY_ADMIN_EMAIL:-}
      STUDY_GOOGLE_CLIENT_ID: ${STUDY_GOOGLE_CLIENT_ID:-}
      STUDY_GOOGLE_CLIENT_SECRET: ${STUDY_GOOGLE_CLIENT_SECRET:-}
      STUDY_PROVISIONER_USER: oll_provisioner
      STUDY_PROVISIONER_PASSWORD_FILE: /run/secrets/provisioner_password
      STUDY_GATEWAY_USER: oll_gateway
      STUDY_GATEWAY_PASSWORD_FILE: /run/secrets/gateway_password
      STUDY_PRACTICE_TABLESPACE: USERS
      # Same accounts on the optional 23ai database (used only when STUDY_DSN_23AI is set).
      STUDY_PROVISIONER_USER_23AI: oll_provisioner
      STUDY_PROVISIONER_PASSWORD_23AI_FILE: /run/secrets/provisioner_password
      STUDY_GATEWAY_USER_23AI: oll_gateway
      STUDY_GATEWAY_PASSWORD_23AI_FILE: /run/secrets/gateway_password
      STUDY_PRACTICE_TABLESPACE_23AI: USERS
      STUDY_LOG_LEVEL: ${STUDY_LOG_LEVEL:-INFO}
      # Empty: both exam tracks use the 19c database. With --profile 23ai: oracle23:1521/FREEPDB1
      STUDY_DSN_23AI: ${STUDY_DSN_23AI:-}
      # Optional memory sizing of the database on first creation (MB, both or neither).
      INIT_SGA_SIZE: ${ORACLE_SGA_MB:-}
      INIT_PGA_SIZE: ${ORACLE_PGA_MB:-}
    secrets:
      - oracle_pwd
      - study_db_password
      - provisioner_password
      - gateway_password
    # Localhost only: the SQL lab runs any SQL you type. 1521 is for SQL Developer / SQLcl.
    ports:
      - "127.0.0.1:${LAB_PORT:-8071}:8071"
      - "127.0.0.1:${ORACLE_PORT:-1525}:1521"
    volumes:
      - ${DATA_DIR:-./data}/oradata:/opt/oracle/oradata
      - ${DATA_DIR:-./data}/app:/var/lib/oracle-lab
    restart: unless-stopped

  # Optional (profile "23ai"): Oracle 23ai Free for the 1Z0-171 track.
  oracle23:
    image: gvenzl/oracle-free:23-slim-faststart
    profiles: ["23ai"]
    depends_on:
      prepare-data:
        condition: service_completed_successfully
    environment:
      ORACLE_PASSWORD_FILE: /run/secrets/oracle_pwd
      APP_USER: orastudy
      APP_USER_PASSWORD_FILE: /run/secrets/study_db_password
    secrets:
      - oracle_pwd
      - study_db_password
      - provisioner_password
      - gateway_password
    volumes:
      - ${DATA_DIR:-./data}/oradata-23ai:/opt/oracle/oradata
      - ./docker/23ai:/container-entrypoint-initdb.d:ro
      - ./docker/oracle/provision-practice-users.sh:/opt/provision-practice-users.sh:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 30s
    restart: unless-stopped

# Plain files on the host, mounted read-only at /run/secrets/<name>; never baked into the image.
secrets:
  oracle_pwd:
    file: ./secrets/oracle_pwd
  study_db_password:
    file: ./secrets/study_db_password
  provisioner_password:
    file: ./secrets/provisioner_password
  gateway_password:
    file: ./secrets/gateway_password
