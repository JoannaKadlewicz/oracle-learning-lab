<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Oracle Learning Lab</title>
  <meta name="description" content="Prepare for the Oracle SQL exams 1Z0-071 and 1Z0-171 with answers checked by a real Oracle database.">
  <meta name="theme-color" content="#EDF1F6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0E1522" media="(prefers-color-scheme: dark)">
  <script>
    let t = "dark";  // dark until this browser picks Light or Automatic in Settings
    try { t = JSON.parse(localStorage.getItem("study:theme")) ?? t; } catch {}
    if (t === "light" || t === "dark") {
      document.documentElement.dataset.theme = t;
      for (const m of document.querySelectorAll('meta[name="theme-color"]')) m.content = t === "dark" ? "#0E1522" : "#EDF1F6";
    }
    // Polish remembered in this browser: hide the page until the catalog is loaded, so English never flashes.
    let l = null;
    try { l = localStorage.getItem("study:lang"); } catch {}
    if (l === "pl") {
      document.documentElement.lang = "pl";
      document.documentElement.classList.add("i18n-pending");
    }
  </script>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <a class="skip" href="#main" data-i18n="Skip to content">Skip to content</a>

  <header class="topbar">

    <a class="brand" href="/"><span class="brand-mark" aria-hidden="true"></span><span class="brand-text"><strong>Oracle Learning Lab</strong></span></a>
    <span class="topbar-exam" id="topbar-exam"></span>
  </header>

  <div class="shell" id="shell">
    <nav class="rail" id="rail" aria-label="Main" data-i18n-aria-label="Main">
      <div class="rail-head">
        <a class="brand" href="/"><span class="brand-mark" aria-hidden="true"></span><span class="brand-text"><strong>Oracle Learning Lab</strong><span data-i18n="SQL certification prep">SQL certification prep</span></span></a>
        <button class="icon-btn rail-close" id="nav-close" aria-label="Close navigation" data-i18n-aria-label="Close navigation"><svg><use href="#i-close"/></svg></button>
      </div>

      <div class="exam-switch">
        <span id="exam-switch-label" data-i18n="Preparing for">Preparing for</span>

      </div>

      <ul class="nav">
        <li class="nav-label" data-i18n="Study">Study</li>
